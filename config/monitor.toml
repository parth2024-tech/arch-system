[monitor]
interval_seconds = 30
retention_days = 7
db_path = "data/monitor.db"

[thresholds]
cpu_temp_warning = 80.0
cpu_temp_critical = 95.0
gpu_temp_warning = 80.0
gpu_temp_critical = 90.0
nvme_temp_warning = 65.0
nvme_temp_critical = 75.0
ram_warning_pct = 85.0
ram_critical_pct = 95.0
disk_warning_pct = 85.0
disk_critical_pct = 95.0
battery_low_pct = 20.0
battery_critical_pct = 10.0

[alerts]
enabled = true
deduplicate_window_seconds = 300

[anomaly]
enabled = true
model_retrain_interval_hours = 6
contamination = 0.05
min_training_samples = 100
zscore_threshold = 3.0
ewma_alpha = 0.3

[predictive]
enabled = true
forecast_horizon_hours = 4
trend_window_hours = 24
risk_threshold = 60

[telegram]
enabled = true
bot_token = ""  # Set via TELEGRAM_BOT_TOKEN env var
chat_id = ""    # Set via TELEGRAM_CHAT_ID env var
parse_mode = "MarkdownV2"
disable_notification = false
alert_severities = ["HIGH", "CRITICAL"]
max_retries = 3
retry_delay = 1.0
rate_limit_per_minute = 20
